    <script>
        var obj1 = {
            name: "Sonal",
            education: "IT",
        };
        var obj2 = {
            age: 22,
            phone: 9860345678,
        };
        var obj3 = { ...obj1, ...obj2 };
        console.log(obj3);
        document.write(obj3);
        document.write(JSON.stringify(obj3));
        document.write(`<pre>${JSON.stringify(obj3, null, 4)}</pre>`);
        // JSON.stringify(value,relacer,space);
        document.write(`<pre>${JSON.stringify(obj3, ['name', 'education'], 4)}</pre>`);
    </script>
    <script>
        function sumRest(name, ...args) {
            //rest oprator used in declaring
            document.write(`Hello ${name} :`);
            let sum = 0;
            for (let i in args) {
                sum += args[i];
            }
            document.write(sum + "<br>");
        }
        var arr4 = [10, 20, 30, 40, 60, 90, 100];
        sumRest("Neha", ...arr4);//while function spread oprator
        //The Spread Operator(...) its  allow us to expand or unpack the elements of and array or properties of an object into indivisual values
    </script>

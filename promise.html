    <!-- Promise Means : I am doing some work now. I will give you the result later.If the work is done successfully then I will give you the result otherwise I will give you the error. -->

    <!-- for example:
    -calling an API
    -ferching data from server
    -Readinga file
    -database operation
    -waiting for timer

    Total 3 states of promise 
    1.Pending : Initial state,before the rejected succeeds or fails.
    2.Fulfilled : The operation completed successfully.
    3.Rejected : The operation failed.

    Create a Promise
    Syntax
    let promise = new promise(function(resolve,reject){

    }); -->
    <script>
        let promise = new Promise(function (resolve, reject) {
            let success = false;
            if (success) {
                resolve("Operation Sucessfully");
            }
            else {
                reject("Operation Failed");
            }
        });
    </script>
    <script>
        function login(username, password) {
            return new Promise(function (resolve, reject) {
                if (username === "admin" && password === "1234") {
                    resolve("Login Successfully");
                }
                else {
                    reject("Invalid username or password");
                }
            });
        }
        login("admin", "1234")
            .then(function (result) {
                console.log(result);
            })
            .catch(function (error) {
                console.log(error);
            });
    </script>

    <script>
        let promise3 = new Promise((resolve, reject) => {
            console.log("Fetching data....");

            setTimeout(() => {
                let dataAvailabe = false;
                if (dataAvailabe) {
                    resolve("Data Received from server...Successfully");
                }
                else {
                    reject("Server Error ... Something went wrong.");
                }
            }, 5000)
        });
        promise3
            .then(res => console.log(res))
            .catch(err => console.log(err))
            .finally(() => console.log("Request process complete..."));
    </script>
